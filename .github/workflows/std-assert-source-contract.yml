name: Atto std assertion source guard (NOT guest)
on: [pull_request, push, workflow_dispatch]
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check immutable source and run lexical source tests
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git rev-parse 'HEAD^{tree}'
          node --test tests/std_assert_source_contract.test.mjs
          echo 'SOURCE_ONLY; Atto guest NOT_EXECUTED' >> "$GITHUB_STEP_SUMMARY"
